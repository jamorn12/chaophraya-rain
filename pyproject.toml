[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpmosaic"
version = "0.1.0"
description = "Chao Phraya Rain: radar mosaic and nowcast for the Chao Phraya-Tha Chin basin from TMD radar images"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "Pillow>=10.2",
  "PyYAML>=6.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
