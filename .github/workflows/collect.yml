name: s1-collect

# Fetch the nine TMD HQ radar images every 15 min and copy new ones to the archive.
# Raw images are NOT committed to git (about 1.2 GB per day); they go to an rclone remote.
#
# Setup (once, in GitHub > Settings > Secrets and variables > Actions):
#   secret   RCLONE_CONF     base64 of an rclone.conf that has the archive remote
#                            (make it with `rclone config` on your own computer, then base64 -w0 rclone.conf)
#   variable ARCHIVE_REMOTE  e.g.  gdrive:ChaoPhraya_Radar_Archive   or   r2:chaophraya-radar
# Without RCLONE_CONF the images are kept only as a workflow artifact for 7 days.
#
# System switch: config/control.yaml (change it with the 'control' workflow or the admin page).
# When it is off this workflow stops after the switch check; a manual run with force=true still collects.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      repeat:
        description: "rounds per job"
        default: "4"
      force:
        description: "collect even if the system switch is off (test)"
        type: boolean
        default: false

concurrency:
  group: s1-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARCHIVE_REMOTE: ${{ vars.ARCHIVE_REMOTE || 'gdrive:ChaoPhraya_Radar_Archive' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: System switch
        id: sw
        run: python -m cpmosaic.control status --gha --force "${{ inputs.force || false }}"

      - name: Archive remote configured?
        id: cfg
        if: steps.sw.outputs.run == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -n "$RCLONE_CONF" ]; then
            curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
            mkdir -p ~/.config/rclone
            printf '%s' "$RCLONE_CONF" | base64 -d > ~/.config/rclone/rclone.conf
            echo "remote=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RCLONE_CONF is not set - images are kept as a 7-day artifact only"
          fi

      - name: Restore last-hash state (duplicate check across jobs)
        if: steps.sw.outputs.run == 'true' && steps.cfg.outputs.remote == 'true'
        run: rclone copy "$ARCHIVE_REMOTE/state" data/state -q || true

      - name: Collect
        if: steps.sw.outputs.run == 'true'
        run: python -m cpmosaic.s1_collect --force --repeat "${{ inputs.repeat || 4 }}"

      - name: Copy to archive
        if: steps.sw.outputs.run == 'true' && steps.cfg.outputs.remote == 'true'
        run: |
          for d in raw inventory state; do
            [ -d "data/$d" ] && rclone copy "data/$d" "$ARCHIVE_REMOTE/$d" --transfers 8 --retries 3 -q
          done

      - name: Keep as artifact (no remote set)
        if: steps.sw.outputs.run == 'true' && steps.cfg.outputs.remote != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collect-${{ github.run_id }}
          path: data
          retention-days: 7
