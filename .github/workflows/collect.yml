name: s1-collect

# Every 15 min: fetch the nine TMD HQ radar images, copy new ones to the archive, and publish
# the site (web/ + the admin status bundle) to GitHub Pages.
# Raw images are NOT committed to git (about 1.2 GB per day); they go to an rclone remote.
#
# Setup (once, in GitHub > Settings > Secrets and variables > Actions):
#   secret   RCLONE_CONF     base64 of an rclone.conf that has the archive remote
#                            (make it with docs/SETUP_ARCHIVE.md)
#   variable ARCHIVE_REMOTE  default  gdrive:ChaoPhraya_Radar_Archive
# Without RCLONE_CONF the images are kept only as a workflow artifact for 7 days.
#
# System switch: config/control.yaml (control workflow or the admin page). When it is off nothing is
# collected, but the site is still published so the pages show the paused state.
# A push that changes web/ re-publishes the site without collecting.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      repeat:
        description: "rounds per job"
        default: "4"
      force:
        description: "collect even if the system switch is off (test)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "src/cpmosaic/s1_collect/status.py", ".github/workflows/collect.yml"]

concurrency:
  group: s1-collect
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ARCHIVE_REMOTE: ${{ vars.ARCHIVE_REMOTE || 'gdrive:ChaoPhraya_Radar_Archive' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: System switch
        id: sw
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m cpmosaic.control status
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            python -m cpmosaic.control status --gha --force "${{ inputs.force || false }}"
          fi

      - name: Archive remote configured?
        id: cfg
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -n "$RCLONE_CONF" ]; then
            curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
            mkdir -p ~/.config/rclone
            printf '%s' "$RCLONE_CONF" | base64 -d > ~/.config/rclone/rclone.conf
            echo "remote=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RCLONE_CONF is not set - images are kept as a 7-day artifact only"
          fi

      - name: Restore state (last hashes, 7-day history, thumbnails)
        if: steps.cfg.outputs.remote == 'true'
        run: rclone copy "$ARCHIVE_REMOTE/state" data/state -q || true

      - name: Collect
        if: steps.sw.outputs.run == 'true'
        run: python -m cpmosaic.s1_collect --force --repeat "${{ inputs.repeat || 4 }}"

      - name: Status bundle for the admin page
        run: python -m cpmosaic.s1_collect.status --root data --site site

      - name: Copy to archive
        if: steps.cfg.outputs.remote == 'true'
        run: |
          for d in raw inventory state; do
            [ -d "data/$d" ] && rclone copy "data/$d" "$ARCHIVE_REMOTE/$d" --transfers 8 --retries 3 -q
          done
          # film-strip frames: keep only the newest ones on the remote too
          [ -d data/state/frames ] && rclone sync data/state/frames "$ARCHIVE_REMOTE/state/frames" -q || true

      - name: Keep as artifact (no remote set)
        if: steps.sw.outputs.run == 'true' && steps.cfg.outputs.remote != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collect-${{ github.run_id }}
          path: data
          retention-days: 7

      - name: Build site
        run: cp -r web/. site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
